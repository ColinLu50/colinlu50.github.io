<button
  class="view-switch"
  type="button"
  data-view-switch
  data-view-mode="editorial"
  aria-label="Switch to Classic presentation style"
  aria-pressed="false"
>
  <span class="view-switch-label" data-view-switch-label>Editorial</span>
  <span class="view-switch-track" aria-hidden="true">
    <span class="view-switch-thumb"></span>
  </span>
</button>
