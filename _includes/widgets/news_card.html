{% assign recent_news = site.news | sort: "date" | reverse %}
<section class="home-section home-news home-reveal">
  <header class="home-section-header">
    <div>
      <p class="home-section-kicker">Updates</p>
      <h2>What’s new.</h2>
    </div>
  </header>

  <div class="home-news-list">
    {% for item in recent_news limit:include.limit %}
    <article>
      <time datetime="{{ item.date | date_to_xmlschema }}">
        <strong>{{ item.date | date: "%d" }}</strong>
        <span>{{ item.date | date: "%b %Y" }}</span>
      </time>
      <div>{{ item.title }}</div>
    </article>
    {% endfor %}
  </div>
</section>
