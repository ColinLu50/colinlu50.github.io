<canvas class="sky-atmosphere" data-sky-canvas aria-hidden="true" hidden></canvas>
<canvas class="sky-ant-stage" data-ant-canvas aria-hidden="true" hidden></canvas>
<button class="sky-ant" data-sky-ant type="button" aria-label="Say hello to the ant" hidden></button>
<span class="sr-only" data-ant-announcement role="status"></span>
<div class="sky-controls" data-sky-controls hidden>
  <div class="sky-control-row">
    <button type="button" class="sky-clock-button" data-sky-reset aria-label="Use current time"><time class="sky-clock" data-sky-clock-text>12:00</time></button>
    <div class="sky-looks" role="group" aria-label="Time of day">
      <button type="button" class="sky-look" data-sky-look="dawn" aria-label="Dawn" aria-pressed="false"><span class="sky-look-dot"></span></button>
      <button type="button" class="sky-look" data-sky-look="noon" aria-label="Noon" aria-pressed="true"><span class="sky-look-dot"></span></button>
      <button type="button" class="sky-look" data-sky-look="sunset" aria-label="Sunset" aria-pressed="false"><span class="sky-look-dot"></span></button>
      <button type="button" class="sky-look" data-sky-look="night" aria-label="Night" aria-pressed="false"><span class="sky-look-dot"></span></button>
    </div>
  </div>
</div>
